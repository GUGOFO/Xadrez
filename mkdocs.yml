repo_url: https://github.com/GUGOFO/Xadrez
repo_name: Xadrez

site_url: https://github.com/GUGOFO/Xadrez/
site_name: Xadrez React
site_description: Reproduzindo o jogo Xadrez
site_author: GUGOFO

nav:
  - Home: index.md
  
  - Requisitos: requisitos/requisitos.md

  - Desenvolvedor: Desenvolvedor/desenvolvedor.md

theme:
  name: material
  logo: img/Logo.png
  favicon: img/Logo.png
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Modo Noturno
    - scheme: slate
      primary: purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Modo Claro


markdown_extensions:
  - pymdownx.emoji
  - pymdownx.tasklist
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
  - attr_list